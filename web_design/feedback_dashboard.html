<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Dashboard - AwareLink</title>
    <!-- Head content now matches admin.html for design consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- START OF UPGRADED STYLES (from admin.html) --- */
        :root {
            --background: #f0f4f8; --surface: #ffffff; --primary: #3b82f6;
            --primary-hover: #2563eb; --text-primary: #1e293b; --text-secondary: #64748b;
            --border-color: #e2e8f0; --legitimate-bg: #e0fbe0; --legitimate-text: #166534;
            --suspicious-bg: #fffbe0; --suspicious-text: #a16207; --malicious-bg: #ffe0e0;
            --malicious-text: #be123c;
        }
        body.dark-mode {
            --background: #0f172a; --surface: #1e293b; --primary: #60a5fa;
            --primary-hover: #3b82f6; --text-primary: #e2e8f0; --text-secondary: #94a3b8;
            --border-color: #334155; --legitimate-bg: rgba(34, 197, 94, 0.15);
            --legitimate-text: #4ade80; --suspicious-bg: rgba(234, 179, 8, 0.15);
            --suspicious-text: #facc15; --malicious-bg: rgba(239, 68, 68, 0.15);
            --malicious-text: #f87171;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--background); color: var(--text-primary); min-height: 100vh; }
        header { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.75rem; font-weight: 600; }
        .header-actions { display: flex; align-items: center; gap: 1rem; }
        .home-link-header {
             text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 500;
            background-color: var(--surface); color: var(--text-primary); border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .home-link-header:hover { background-color: var(--background); }
        .dark-mode-toggle {
            background: var(--surface); border: 1px solid var(--border-color); color: var(--text-primary);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.2s;
        }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .admin-card {
            background-color: var(--surface); backdrop-filter: blur(16px); padding: 2rem;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }
        .admin-card h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .table-container { max-height: 600px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); word-wrap: break-word; }
        th { background-color: var(--background); font-weight: 600; position: sticky; top: 0; z-index: 1; }
        tr:hover { background-color: rgba(96, 165, 250, 0.1); }
        .feedback-accurate { color: var(--legitimate-text); font-weight: bold; }
        .feedback-inaccurate { color: var(--malicious-text); font-weight: bold; }
        .btn-delete { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1rem; padding: 5px 10px; border-radius: 6px; transition: all 0.2s ease; }
        .btn-delete:hover { color: var(--malicious-text); background-color: var(--malicious-bg); }
        /* --- END OF UPGRADED STYLES --- */
    </style>
</head>
<body>
    <!-- START OF NEW HEADER -->
    <header>
        <h1>User Feedback Dashboard</h1>
        <div class="header-actions">
            <a href="/admin" class="home-link-header"><i class="fa-solid fa-arrow-left"></i> Back to Main Dashboard</a>
            <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>
    <!-- END OF NEW HEADER -->
    <div class="container">
        <!-- Website Analysis Feedback -->
        <div class="admin-card">
            <!-- NEW: Icon added for consistency -->
            <h2><i class="fa-solid fa-globe"></i> Website Analysis Feedback</h2>
            <div class="table-container">
                <table id="website-feedback-table">
                    <thead><tr><th style="width: 30%;">URL</th><th style="width: 10%;">Accurate?</th><th style="width: 50%;">Reason / Details</th><th style="width: 10%;">Actions</th></tr></thead>
                    <tbody id="website-feedback-tbody"></tbody>
                </table>
            </div>
        </div>
        <!-- Fake News Feedback -->
        <div class="admin-card">
            <!-- NEW: Icon added for consistency -->
            <h2><i class="fa-solid fa-newspaper"></i> Fake News Analysis Feedback</h2>
            <div class="table-container">
                <table id="news-feedback-table">
                    <thead><tr><th style="width: 10%;">Accurate?</th><th style="width: 80%;">Reason / Details</th><th style="width: 10%;">Actions</th></tr></thead>
                    <tbody id="news-feedback-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // NEW: Initialize theme and add event listener for the toggle
    initializeTheme();
    document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);

    loadWebsiteFeedback();
    loadNewsFeedback();
});

// --- START OF NEW THEME FUNCTIONS (from admin.html) ---
function initializeTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeToggle').innerHTML = '<i class="fa-solid fa-sun"></i>';
    } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('darkModeToggle').innerHTML = '<i class="fa-solid fa-moon"></i>';
    }
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initializeTheme();
}
// --- END OF NEW THEME FUNCTIONS ---

async function loadWebsiteFeedback() {
    try {
        const response = await fetch('/api/all-feedback');
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        renderTable('website', data);
    } catch (error) {
        console.error('Failed to load website feedback:', error);
        document.getElementById('website-feedback-tbody').innerHTML = `<tr><td colspan="4">Error loading feedback.</td></tr>`;
    }
}

async function loadNewsFeedback() {
    try {
        const response = await fetch('/api/all-news-feedback');
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        renderTable('news', data);
    } catch (error)
 {
        console.error('Failed to load news feedback:', error);
        document.getElementById('news-feedback-tbody').innerHTML = `<tr><td colspan="3">Error loading feedback.</td></tr>`;
    }
}

function renderTable(type, data) {
    const tbody = document.getElementById(`${type}-feedback-tbody`);
    tbody.innerHTML = '';

    const colCount = (type === 'website') ? 4 : 3;

    if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colCount}">No feedback has been submitted for this category yet.</td></tr>`;
        return;
    }

    data.forEach(item => {
        let row = document.createElement('tr');
        // Improved: Sanitize text content to prevent potential XSS from user 'other_text' input
        let reasonHtml = item.reason ? document.createTextNode(item.reason).textContent : 'N/A';
        if (item.other_text) {
            const sanitizedOtherText = document.createTextNode(item.other_text).textContent;
            reasonHtml += `<br><small style="color: var(--text-secondary);">${sanitizedOtherText}</small>`;
        }

        if (type === 'website') {
            const sanitizedUrl = document.createTextNode(item.url).textContent;
            row.innerHTML = `
                <td>${sanitizedUrl}</td>
                <td class="${item.is_accurate ? 'feedback-accurate' : 'feedback-inaccurate'}">${item.is_accurate ? 'Yes' : 'No'}</td>
                <td>${reasonHtml}</td>
                <td><button class="btn-delete" onclick="deleteItem('feedback', ${item.id})"><i class="fa-solid fa-trash-can"></i></button></td>
            `;
        } else if (type === 'news') {
             row.innerHTML = `
                <td class="${item.is_accurate ? 'feedback-accurate' : 'feedback-inaccurate'}">${item.is_accurate ? 'Yes' : 'No'}</td>
                <td>${reasonHtml}</td>
                <td><button class="btn-delete" onclick="deleteItem('news_feedback', ${item.id})"><i class="fa-solid fa-trash-can"></i></button></td>
            `;
        }
        tbody.appendChild(row);
    });
}

async function deleteItem(type, id) {
    const endpoint = type === 'feedback' ? `/api/delete-feedback/${id}` : `/api/delete-news-feedback/${id}`;
    if (!confirm(`Are you sure you want to delete this ${type.replace('_', ' ')} record?`)) return;

    try {
        const response = await fetch(endpoint, { method: 'DELETE' });
        if (!response.ok) throw new Error('Deletion failed on the server.');
        
        if(type === 'feedback') {
            loadWebsiteFeedback();
        } else {
            loadNewsFeedback();
        }
    } catch (error) {
        console.error('Failed to delete item:', error);
        alert('An error occurred while deleting the item. Please try again.');
    }
}
</script>
</body>
</html>
